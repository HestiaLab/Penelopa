name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # Penelopa links the SkiaSharp native assets into dotnet.wasm, so the
      # wasm-tools workload is required (unlike Atlas.Demo, which has no
      # native dependencies).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Penelopa.csproj's BuildTypeScript target compiles the committed TS when
      # the local npm toolchain is present. Restore it here so the deployed
      # bundle is compiled from source with the lock-pinned tsc 5.9.3; a local
      # build without node_modules falls back to the committed JS.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore front-end toolchain
        run: npm ci

      - name: Restore .NET packages in locked mode
        run: dotnet restore Penelopa.sln --locked-mode

      - name: Publish Penelopa
        run: |
          dotnet publish src/Penelopa/Penelopa.csproj \
            --configuration Release \
            --no-restore \
            --output publish/site

      # GitHub Pages project site maps the deployed artifact root to the
      # /Penelopa/ subpath. The dev index.html keeps base href="/" so local
      # `dotnet run` works; the deployed copy must resolve assets from
      # /Penelopa/. Also append a version query to the entry scripts so a
      # stale CDN/browser cache cannot serve an old boot loader against a new
      # boot manifest (observed as a subresource-integrity hash mismatch).
      - name: Rewrite base href and cache-bust for the /Penelopa/ subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/Penelopa/" />|' publish/site/wwwroot/index.html
          sed -i "s|src=\"js/penelopa.js\"|src=\"js/penelopa.js?v=${{ github.sha }}\"|" publish/site/wwwroot/index.html
          sed -i "s|src=\"_framework/blazor.webassembly.js\"|src=\"_framework/blazor.webassembly.js?v=${{ github.sha }}\"|" publish/site/wwwroot/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site/wwwroot

      - uses: actions/deploy-pages@v4
        id: deployment
